<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>enenenwei AI</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #eee7ff, #f9f3ff, #e7f0ff); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #333; } /* 主窗口 */ .chat-container { width: 95%; max-width: 650px; height: 90vh; max-height: 800px; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(18px); border-radius: 28px; box-shadow: 0 20px 60px rgba(80, 50, 130, 0.18); overflow: hidden; display: flex; flex-direction: column; } /* 顶部 */ .header { padding: 22px 25px; background: linear-gradient(135deg, #8b6edb, #b18bea); color: white; display: flex; align-items: center; gap: 14px; } .ai-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 25px; } .header-text h1 { margin: 0; font-size: 20px; } .header-text p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; } /* 聊天区域 */ .chat-box { flex: 1; padding: 25px; overflow-y: auto; scroll-behavior: smooth; } .message { display: flex; margin-bottom: 18px; animation: appear 0.25s ease; } @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } .message.user { justify-content: flex-end; } .bubble { max-width: 78%; padding: 13px 17px; border-radius: 18px; line-height: 1.6; font-size: 15px; word-break: break-word; } .message.ai .bubble { background: #f1ecff; color: #4a4160; border-bottom-left-radius: 5px; } .message.user .bubble { background: linear-gradient(135deg, #8b6edb, #a981df); color: white; border-bottom-right-radius: 5px; } /* 正在输入 */ .typing { display: none; padding: 0 25px 12px; color: #999; font-size: 13px; } .typing span { animation: blink 1.2s infinite; } @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } } /* 输入区域 */ .input-area { padding: 15px 18px; border-top: 1px solid rgba(0,0,0,0.06); background: rgba(255,255,255,0.7); display: flex; gap: 10px; } .input-area input { flex: 1; border: none; outline: none; background: #f4f1fa; border-radius: 18px; padding: 14px 17px; font-size: 15px; } .input-area button { width: 52px; border: none; border-radius: 18px; background: linear-gradient(135deg, #8b6edb, #a981df); color: white; font-size: 20px; cursor: pointer; transition: 0.2s; } .input-area button:hover { transform: scale(1.05); } .input-area button:active { transform: scale(0.95); } /* 清空按钮 */ .clear-btn { margin-left: auto; background: none; border: none; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 12px; } @media (max-width: 600px) { body { align-items: stretch; } .chat-container { width: 100%; height: 100vh; max-height: none; border-radius: 0; } .bubble { max-width: 85%; } } </style> </head> <body> <div class="chat-container"> <div class="header"> <div class="ai-icon">🤖</div> <div class="header-text"> <h1>enenenwei AI</h1> <p>一个不一定认真回答问题的 AI</p> </div> <button class="clear-btn" onclick="clearChat()"> 清空 </button> </div> <div class="chat-box" id="chatBox"> <div class="message ai"> <div class="bubble"> 你好呀！✨<br> 我是 enenenwei AI。<br> 你可以随便问我什么，不过……我不保证认真回答。嘿嘿。 </div> </div> </div> <div class="typing" id="typing"> enenenwei AI 正在思考<span>……</span> </div> <div class="input-area"> <input type="text" id="userInput" placeholder="输入你想说的话……" autocomplete="off" > <button onclick="sendMessage()"> ➤ </button> </div> </div> <script> /* ========================= AI 回复库 ========================= */ const responses = { greeting: [ "你好呀～✨", "嗨！终于有人来找我聊天了。", "你好！啦啦啦啦～🎵", "哈喽！今天也要开心哦！" ], goodPerson: [ "啦啦啦啦～唱歌时间到！🎤", "这个问题嘛……我先去问一下宇宙。🌌", "当然啦！至少在我这里是。✨", "嗯……这个问题涉及哲学，请明天再问。", "你问得很好，下一个问题。" ], who: [ "我是 enenenwei AI，一个非常厉害的人工智能……大概吧。", "我的身份？秘密。🤫", "我是一个被关在网页里的 AI。", "简单来说，我负责一本正经地胡说八道。" ], tired: [ "累了就休息一下嘛～", "不可以累坏自己！去喝点水。🥤", "我也累了，我们一起躺平。😴", "今天的任务：什么都不做五分钟。" ], sad: [ "抱抱你一下。🫂", "今天不开心的话，可以先发呆一会儿。", "没关系，慢慢来。", "我宣布：现在开始禁止难过三分钟。" ], love: [ "爱情这种东西……我只知道吃饭。🍚", "这个问题太深奥了，我选择唱歌。🎤", "喜欢一个人应该是一件很奇妙的事情吧。", "嗯……让我想想。这个问题我拒绝装懂。" ], random: [ "啦啦啦啦啦～🎵", "这个问题……我选择不知道。", "等等，我的大脑正在加载。", "你说得对，但是我不同意。🤨", "这个问题值得思考三百年。", "我宣布：答案是草莓蛋糕。🍓", "嗯嗯嗯……然后呢？", "非常有道理。虽然我完全没听懂。", "今天不回答这个问题，我要去晒太阳。☀️", "啊？你刚才说什么？", "这件事情很复杂，让我们先吃饭。", "我觉得可以。为什么可以？不知道。", "好的！但是没有然后。", "恭喜你发现了一个没有答案的问题。✨", "我正在努力思考……思考失败。", "这个问题超出了我的人工智能范围。" ] }; /* ========================= 随机选择 ========================= */ function randomAnswer(array) { return array[Math.floor(Math.random() * array.length)]; } /* ========================= 根据关键词判断回复 ========================= */ function getResponse(text) { const message = text.toLowerCase(); if ( message.includes("你好") || message.includes("嗨") || message.includes("哈喽") || message.includes("hello") || message.includes("hi") ) { return randomAnswer(responses.greeting); } if ( message.includes("好人") || message.includes("坏人") || message.includes("善良") || message.includes("人好吗") ) { return randomAnswer(responses.goodPerson); } if ( message.includes("你是谁") || message.includes("叫什么") || message.includes("身份") ) { return randomAnswer(responses.who); } if ( message.includes("累") || message.includes("疲惫") || message.includes("困") ) { return randomAnswer(responses.tired); } if ( message.includes("难过") || message.includes("伤心") || message.includes("哭") || message.includes("不开心") ) { return randomAnswer(responses.sad); } if ( message.includes("喜欢") || message.includes("爱情") || message.includes("恋爱") || message.includes("爱") ) { return randomAnswer(responses.love); } return randomAnswer(responses.random); } /* ========================= 添加消息 ========================= */ function addMessage(text, type) { const chatBox = document.getElementById("chatBox"); const message = document.createElement("div"); message.className = "message " + type; const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = text; message.appendChild(bubble); chatBox.appendChild(message); chatBox.scrollTop = chatBox.scrollHeight; } /* ========================= 发送消息 ========================= */ function sendMessage() { const input = document.getElementById("userInput"); const text = input.value.trim(); if (!text) return; addMessage(text, "user"); input.value = ""; const typing = document.getElementById("typing"); typing.style.display = "block"; const delay = 500 + Math.random() * 900; setTimeout(() => { typing.style.display = "none"; const answer = getResponse(text); addMessage(answer, "ai"); }, delay); } /* ========================= Enter发送 ========================= */ document.getElementById("userInput").addEventListener( "keydown", function(event) { if (event.key === "Enter") { sendMessage(); } } ); /* ========================= 清空聊天 ========================= */ function clearChat() { const chatBox = document.getElementById("chatBox"); chatBox.innerHTML = ` <div class="message ai"> <div class="bubble"> 聊天记录已经被我偷偷吃掉了。🍪<br> 重新开始吧～ </div> </div> `; } </script> </body> </html>
