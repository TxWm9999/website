<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>yaohouxing</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eee7ff, #f9f3ff, #e7f0ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
}

/* 主窗口 */

.chat-container {
    width: 95%;
    max-width: 650px;
    height: 90vh;
    max-height: 800px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(80, 50, 130, 0.18);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* 顶部 */

.header {
    padding: 22px 25px;
    background: linear-gradient(135deg, #8b6edb, #b18bea);
    color: white;
    display: flex;
    align-items: center;
    gap: 14px;
}

.ai-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.header-text h1 {
    margin: 0;
    font-size: 20px;
}

.header-text p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
}

/* 聊天区域 */

.chat-box {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    scroll-behavior: smooth;
}

.message {
    display: flex;
    margin-bottom: 18px;
    animation: appear 0.25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;
    padding: 13px 17px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 15px;
    word-break: break-word;
}

.message.ai .bubble {
    background: #f1ecff;
    color: #4a4160;
    border-bottom-left-radius: 5px;
}

.message.user .bubble {
    background: linear-gradient(135deg, #8b6edb, #a981df);
    color: white;
    border-bottom-right-radius: 5px;
}

/* 正在输入 */

.typing {
    display: none;
    padding: 0 25px 12px;
    color: #999;
    font-size: 13px;
}

.typing span {
    animation: blink 1.2s infinite;
}

@keyframes blink {

    0%, 100% {
        opacity: 0.3;
    }

    50% {
        opacity: 1;
    }

}

/* 输入区域 */

.input-area {
    padding: 15px 18px;
    border-top: 1px solid rgba(0,0,0,0.06);
    background: rgba(255,255,255,0.7);
    display: flex;
    gap: 10px;
}

.input-area input {
    flex: 1;
    border: none;
    outline: none;
    background: #f4f1fa;
    border-radius: 18px;
    padding: 14px 17px;
    font-size: 15px;
}

.input-area button {
    width: 52px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #8b6edb, #a981df);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.input-area button:hover {
    transform: scale(1.05);
}

.input-area button:active {
    transform: scale(0.95);
}

/* 清空按钮 */

.clear-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    font-size: 12px;
}

@media (max-width: 600px) {

    body {
        align-items: stretch;
    }

    .chat-container {
        width: 100%;
        height: 100vh;
        max-height: none;
        border-radius: 0;
    }

    .bubble {
        max-width: 85%;
    }

}

</style>

</head>

<body>

<div class="chat-container">

    <div class="header">

        <div class="ai-icon">🤖</div>

        <div class="header-text">

            <h1>0053号</h1>

            <p>0053号在此！</p>

        </div>

        <button class="clear-btn" onclick="clearChat()">
            清空
        </button>

    </div>


    <div class="chat-box" id="chatBox">

        <div class="message ai">

            <div class="bubble">

                你好呀！✨<br>

                我是……不告诉你我是谁~。<br>

                你可以随便问我什么，不过……我不保证认真回答。哼哼。

            </div>

        </div>

    </div>


    <div class="typing" id="typing">

        稍等噢~我正在思考<span>……</span>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="输入你想说的话……"
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

/* =========================
   AI 回复库
   ========================= */

const responses = {

    greeting: [

        "你好呀～✨",

        "xixixi",

        "你好！啦啦啦啦～🎵",

        "哈喽！今天也要开心哦！"

    ],


    goodPerson: [

        "啦啦啦啦～休息时间到！🎤",

        "这个问题嘛……我先去问一下宇宙。🌌",

        "当然啦！至少在我这里是。✨",

        "嗯……我想是的！",

        "当然！无条件肯定！！"

    ],


    tw: [

        "不知道反正桐心薇泯99",

        "桐心薇泯就是真情侣来的啊",

        "雪雪薇薇永远在一起 ",

        "反正桐薇中百美帝",

        "永远追随薇薇雪雪"

    ],


    who: [

        "我是一个神秘的人",

        "一个非常厉害的人……大概吧。",

        "我的身份？秘密。🤫",

        "或许…我是你想见的人呢？。",

        "说来话长长话短说，我也不知道~"

    ],


    tired: [

        "累了就休息一下嘛～",

        "不可以累坏自己！去喝点水。🥤",

        "我也累了，我们一起躺平。😴",

        "今天的任务：什么都不做五分钟。"

    ],


    sad: [

        "抱抱你一下。🫂",

        "今天不开心的话，可以先发呆一会儿。",

        "没关系，慢慢来。",

        "我宣布：现在开始禁止难过三分钟。",

        "在夜晚抬抬头如果有星星，那就是我;如果没有嘛…那就是我飞到你心里了",

        "你要相信，总有一个人为你而来，就比如我"

    ],


    love: [

        "爱情这种东西……我只知道吃好饭睡好觉，你也要照顾好自己好不好~答应我嘛~",

        "这个问题太深奥了，我选择吃花生酱饼干！",

        "喜欢一个人应该是一件很奇妙的事情吧。",

        "嗯……让我想想。这个问题或许会有人用实际行动告诉你的！"

    ],


    random: [

        "啦啦啦啦啦～🎵",

        "这个问题……我选择不知道。",

        "等等，我的大脑正在加载。",

        "嘿嘿我好像走神了……😳",

        "这个问题值得思考三百年。",

        "我宣布：答案是花生酱饼干！🥜",

        "嗯嗯嗯……对不起呀~你打的字太漂亮了，我看入迷了(⑅˃◡˂⑅)",

        "非常有道理。虽然我完全没听懂。",

        "今天不回答这个问题，我要去晒太阳。☀️",

        "嗯……反正我对你无条件肯定！",

        "这件事情很复杂，让我们先吃饭。",

        "我觉得可以。为什么可以？没有道理，或许和你喜欢ta一样吧。",

        "其实有时我也在想…天上星星有几颗",

        "恭喜你发现了一个没有答案的问题。✨",

        "我正在努力思考……思考失败(._.)。",

        "这个…我第一次听见这样的事欸"

    ]

};


/* =========================
   随机选择
   ========================= */

function randomAnswer(array) {

    return array[Math.floor(Math.random() * array.length)];

}


/* =========================
   根据关键词判断回复
   ========================= */

function getResponse(text) {

    const message = text.toLowerCase();


    if (

        message.includes("你好") ||

        message.includes("嗨") ||

        message.includes("哈喽") ||

        message.includes("hello") ||

        message.includes("hi")

    ) {

        return randomAnswer(responses.greeting);

    }


    if (

        message.includes("好人") ||

        message.includes("坏人") ||

        message.includes("善良") ||

        message.includes("人好吗")

    ) {

        return randomAnswer(responses.goodPerson);

    }


    if (

        message.includes("桐薇") ||

        message.includes("薇桐") ||

        message.includes("tw") ||

        message.includes("田曦薇李一桐") ||

        message.includes("53") ||

        message.includes("35") ||

        message.includes("88") ||

        message.includes("李雪田曦薇") ||

        message.includes("田曦薇李雪") ||

        message.includes("李一桐田曦薇")

    ) {

        return randomAnswer(responses.tw);

    }


    if (

        message.includes("你是谁") ||

        message.includes("叫什么") ||

        message.includes("身份")

    ) {

        return randomAnswer(responses.who);

    }


    if (

        message.includes("累") ||

        message.includes("疲惫") ||

        message.includes("困")

    ) {

        return randomAnswer(responses.tired);

    }


    if (

        message.includes("难过") ||

        message.includes("伤心") ||

        message.includes("哭") ||

        message.includes("不开心")

    ) {

        return randomAnswer(responses.sad);

    }


    if (

        message.includes("喜欢") ||

        message.includes("爱情") ||

        message.includes("恋爱") ||

        message.includes("爱")

    ) {

        return randomAnswer(responses.love);

    }


    return randomAnswer(responses.random);

}


/* =========================
   添加消息
   ========================= */

function addMessage(text, type) {

    const chatBox = document.getElementById("chatBox");

    const message = document.createElement("div");

    message.className = "message " + type;


    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;


    message.appendChild(bubble);

    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;

}


/* =========================
   发送消息
   ========================= */

function sendMessage() {

    const input = document.getElementById("userInput");

    const text = input.value.trim();


    if (!text) {

        return;

    }


    addMessage(text, "user");

    input.value = "";


    const typing = document.getElementById("typing");

    typing.style.display = "block";


    const delay = 500 + Math.random() * 900;


    setTimeout(() => {

        typing.style.display = "none";

        const answer = getResponse(text);

        addMessage(answer, "ai");

    }, delay);

}


/* =========================
   Enter发送
   ========================= */

document.getElementById("userInput").addEventListener(

    "keydown",

    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }

);


/* =========================
   清空聊天
   ========================= */

function clearChat() {

    const chatBox = document.getElementById("chatBox");


    chatBox.innerHTML = `

        <div class="message ai">

            <div class="bubble">

                聊天记录已经被我偷偷吃掉了。🍪<br>

                重新开始吧～

            </div>

        </div>

    `;

}

</script>

</body>

</html>
